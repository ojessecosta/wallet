<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Wallet Live - Cadastro</title>
    <style>
        body { font-family: monospace; background: #121212; color: #00ff66; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
        .card { background: #1e1e1e; padding: 2rem; border: 1px solid #333; width: 300px; }
        input { width: 100%; padding: 0.5rem; margin: 0.5rem 0 1rem 0; background: #121212; border: 1px solid #444; color: #fff; }
        button { width: 100%; padding: 0.75rem; background: #00ff66; color: #000; border: none; font-weight: bold; cursor: pointer; }
    </style>
</head>
<body>
    <div class="card">
        <h2>// register</h2>
        <form action="/register" method="POST">
            <label>E-mail:</label>
            <input type="email" name="email" required />
            
            <label>Senha:</label>
            <input type="password" name="password" required />
            
            <button type="submit">Cadastrar</button>
        </form>
    </div>
</body>
</html>
